name: FinTrack checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Check server syntax
        run: find server/src -name '*.js' -type f -print0 | xargs -0 -n 1 node --check
      - name: Run server regression suite
        shell: bash
        run: |
          set -euo pipefail
          node -e 'for(const name of Object.keys(require("./server/package.json").scripts).filter(x=>x.startsWith("test:"))) console.log(name)' |
            while IFS= read -r test; do npm run "$test" --prefix server; done
      - name: Lint React client
        run: npm run lint --prefix client
      - name: Build React client
        run: npm run build --prefix client
